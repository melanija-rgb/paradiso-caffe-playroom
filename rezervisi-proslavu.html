<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rezerviši proslavu | Paradiso Caffe & Playroom</title>
    <meta
      name="description"
      content="Rezervišite rođendansku proslavu u Paradiso Caffe & Playroom."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-booking">
    <header class="site-header is-solid">
      <a class="brand-mark" href="index.html" aria-label="Paradiso početna">
        <img src="images/logo.png" alt="Paradiso Caffe & Playroom" />
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Meni">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Glavna navigacija">
        <a href="index.html">Početna</a>
        <a href="o-nama.html">O nama</a>
        <a href="galerija.html">Galerija</a>
        <a href="rodjendanski-paketi.html">Rođendanski paketi</a>
        <a href="rezervisi-proslavu.html" aria-current="page">Rezerviši proslavu</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="admin.html">Admin</a>
      </nav>
    </header>

    <main class="booking">
      <h1 class="booking__title">Rezerviši proslavu</h1>
      <p class="booking__lead">Odaberite datum, termin i paket.</p>

      <form class="booking__form" id="booking-form" novalidate>
        <fieldset class="booking__fieldset">
          <legend>Datum</legend>
          <div class="calendar" id="calendar" aria-label="Kalendar za odabir datuma">
            <div class="calendar__header">
              <button type="button" class="calendar__nav" id="cal-prev" aria-label="Prethodni mjesec">‹</button>
              <h2 class="calendar__month" id="cal-month"></h2>
              <button type="button" class="calendar__nav" id="cal-next" aria-label="Sljedeći mjesec">›</button>
            </div>
            <div class="calendar__weekdays" aria-hidden="true">
              <span>Pon</span><span>Uto</span><span>Sri</span><span>Čet</span><span>Pet</span><span>Sub</span><span>Ned</span>
            </div>
            <div class="calendar__days" id="cal-days"></div>
          </div>
          <input type="hidden" name="datum" id="booking-date" required />
          <p class="booking__selected" id="selected-date-label">Niste odabrali datum.</p>
        </fieldset>

        <fieldset class="booking__fieldset">
          <legend>Vrijeme</legend>
          <div class="booking__options">
            <label class="booking__option">
              <input type="radio" name="vrijeme" value="12:00–15:00" required />
              <span>12:00 – 15:00</span>
            </label>
            <label class="booking__option">
              <input type="radio" name="vrijeme" value="17:00–20:00" />
              <span>17:00 – 20:00</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="booking__fieldset">
          <legend>Paket</legend>
          <div class="booking__options">
            <label class="booking__option">
              <input type="radio" name="paket" value="Paket 1" required />
              <span>Paket 1</span>
            </label>
            <label class="booking__option">
              <input type="radio" name="paket" value="Paket 2" />
              <span>Paket 2</span>
            </label>
          </div>
        </fieldset>

        <div class="booking__fields">
          <label class="booking__field">
            <span>Ime i prezime</span>
            <input type="text" name="ime" id="booking-name" autocomplete="name" required />
          </label>
          <label class="booking__field">
            <span>Broj telefona</span>
            <input type="tel" name="telefon" id="booking-phone" autocomplete="tel" required />
          </label>
        </div>

        <p class="booking__error" id="booking-error" hidden></p>

        <button type="submit" class="booking__submit">Rezerviši</button>
      </form>

      <div class="booking__success" id="booking-success" hidden>
        <h2>Hvala vam!</h2>
        <p id="booking-success-text"></p>
      </div>
    </main>

    <script src="store.js"></script>
    <script src="script.js"></script>
  </body>
</html>
